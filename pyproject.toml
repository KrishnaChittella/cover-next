[project]
name = "metaspike"
version = "0.1.0"
description = "MetaSpike data-intelligence pipeline: which game has the strongest content opportunity right now, and why."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
]

[project.scripts]
metaspike = "metaspike.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.4",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6",
]
site = [
    "anthropic>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metaspike"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "RUF"]
# The multiplication sign is used deliberately in user-facing explanation text.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Look-alike Unicode characters are the subject of these tests.
"tests/test_normalize.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not slow'"
markers = [
    "live: hits a real source API; run explicitly with `uv run pytest -m live`",
    "slow: an offline proof that takes minutes; run explicitly with `uv run pytest -m slow`",
]

[tool.uv]
# `site`: the public site build only (studio-story headlines); kept out of the job image.
default-groups = ["dev", "site"]
