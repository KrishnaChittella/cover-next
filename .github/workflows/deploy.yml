# Production deployment.
#
# WHO CAN DEPLOY
# Cloud authentication uses short-lived GitHub OIDC tokens through Workload Identity
# Federation. There is no service-account key anywhere, and no GitHub environment or
# reviewer is relied on. Google accepts a token only when all of these are true:
# this repository and owner (by numeric id), private, the main branch, THIS workflow
# file as it exists on main, started by hand with workflow_dispatch, by the owner.
#
# A push to main runs verification and nothing else. Its token would be refused by
# Google, and the jobs that authenticate do not start for a push in the first place.
#
# HOW A DEPLOYMENT HAPPENS (always by hand, always two runs)
#   1. operation = plan    builds, scans and pushes the image by digest, plans, and
#                          publishes the plan with its SHA-256. Changes nothing.
#                          With reuse_deployed_image it builds and pushes nothing: it
#                          plans with the one image all seven jobs already run, so an
#                          infrastructure change is not mixed with an image rollout.
#   2. operation = apply   applies exactly that plan: it must be given the run id and
#                          the SHA-256 of the plan that was read. Nothing is re-planned.
#   operation = identity-check proves federation works and changes nothing at all.
#
# The values below are identifiers, not credentials, stored as repository VARIABLES.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "identity-check (read-only), plan (no change), or apply (a reviewed plan)"
        type: choice
        options: [identity-check, plan, apply]
        default: identity-check
      plan_run_id:
        description: "apply only: id of the `plan` run whose plan was reviewed"
        type: string
        default: ""
      plan_sha256:
        description: "apply only: SHA-256 of that plan, copied from the plan run's summary"
        type: string
        default: ""
      allow_destroy:
        description: "apply only: the reviewed plan destroys or replaces resources, and that is intended"
        type: boolean
        default: false
      reuse_deployed_image:
        description: "plan only: an infrastructure-only plan. Plan with the image all seven jobs already run; build and push nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: us-central1
  TERRAFORM_VERSION: "1.16.5"

jobs:
  # The same verification pull requests get, run once for this commit. Every job in it
  # must pass: tests (including the baseline_rules_v1 reproduction gate), the resolver
  # safety gate, Terraform validation and the image build and scan.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Proves federation and nothing more: who Google says we are. Read-only.
  identity-check:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.operation == 'identity-check'
      && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate (OIDC, no key)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Who are we, and how did we get here
        run: |
          kind="$(jq -r .type "${GOOGLE_APPLICATION_CREDENTIALS}")"
          account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          project="$(gcloud projects describe '${{ vars.GCP_PROJECT_ID }}' --format='value(projectId,lifecycleState)')"
          {
            echo "## Identity check (read-only)"
            echo "- credential type: \`${kind}\` (a federated token; \`service_account\` would mean a key)"
            echo "- Google principal: \`${account}\`"
            echo "- project: \`${project}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${kind}" = "external_account"
          test "${account}" = "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

  # Builds and pushes the image, then plans. It changes no infrastructure.
  #
  # An infrastructure-only plan (reuse_deployed_image) skips the build and the push and
  # plans with the image the jobs already run. That image is read from the jobs, never
  # chosen by whoever starts the run, and if it cannot be established the job fails:
  # there is no falling back to a new image. The verify job above has still built and
  # scanned this commit's image either way.
  plan:
    # `needs` means a failed or cancelled verification skips this job: no credential
    # is ever issued. The `if` means a push never starts it at all.
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.operation == 'plan'
      && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build
        if: ${{ !inputs.reuse_deployed_image }}
        run: .github/scripts/build-image.sh candidate
      - name: Smoke
        if: ${{ !inputs.reuse_deployed_image }}
        run: |
          docker run --rm candidate --help
          test "$(docker run --rm --entrypoint id candidate -u)" != "0"
      - name: Scan before anything is pushed
        if: ${{ !inputs.reuse_deployed_image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Authenticate (OIDC, no key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push and record the digest
        id: push
        if: ${{ !inputs.reuse_deployed_image }}
        run: |
          repository="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/metaspike/metaspike"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker tag candidate "${repository}:${GITHUB_SHA}"
          docker push "${repository}:${GITHUB_SHA}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repository}:${GITHUB_SHA}")"
          echo "image=${digest}" >> "$GITHUB_OUTPUT"
      - name: Resolve the image the jobs already run
        id: deployed
        if: ${{ inputs.reuse_deployed_image }}
        run: |
          image="$(.github/scripts/resolve-deployed-image.sh '${{ vars.GCP_PROJECT_ID }}' "${REGION}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      # Exactly one of the two steps above ran. This names which, and refuses anything
      # that is not an immutable digest in MetaSpike's own repository.
      - name: Choose the image to plan with
        id: image
        env:
          REUSE: ${{ inputs.reuse_deployed_image }}
          BUILT: ${{ steps.push.outputs.image }}
          DEPLOYED: ${{ steps.deployed.outputs.image }}
        run: |
          if [ "${REUSE}" = "true" ]; then
            image="${DEPLOYED}"; origin="reused: the image all seven jobs already run"
            test -z "${BUILT}" || { echo "::error::an image was built in an infrastructure-only plan"; exit 1; }
          else
            image="${BUILT}"; origin="built and pushed by this run"
            test -z "${DEPLOYED}" || { echo "::error::a deployed image was resolved in an application plan"; exit 1; }
          fi
          repository="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/metaspike/metaspike"
          [[ "${image}" =~ ^${repository}@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::no acceptable image to plan with (${origin})"; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # The schedule is the unbounded hourly one: schedule_mode is passed as steady_state.
      # Terraform refuses a soak window together with it, so any SOAK_* variable left set
      # stops the plan here with a plain message. Whether the scheduler actually runs is
      # still the SCHEDULER_PAUSED variable alone; this workflow never writes false.
      #
      # The three source-secret versions are repository variables holding a version
      # NUMBER (never a secret value). Unset means the jobs carry no reference to that
      # secret. Terraform refuses "latest" and anything that is not a positive whole
      # number; the check here only gives a clearer error sooner. Giving the Steam jobs
      # their key does not start Steam collection: the dispatcher's configuration and the
      # control record decide which sources are collected, and only Wikimedia is.
      - name: Plan
        working-directory: infra/prod
        env:
          SOAK_MONTH: ${{ vars.SOAK_MONTH }}
          SOAK_START_DAY: ${{ vars.SOAK_START_DAY }}
          SOAK_END_DAY: ${{ vars.SOAK_END_DAY }}
          SOAK_CEILING: ${{ vars.SOAK_DAILY_EXECUTION_CEILING }}
          STEAM_WEB_API_KEY_VERSION: ${{ vars.STEAM_WEB_API_KEY_VERSION }}
          IGDB_CLIENT_ID_VERSION: ${{ vars.IGDB_CLIENT_ID_VERSION }}
          IGDB_CLIENT_SECRET_VERSION: ${{ vars.IGDB_CLIENT_SECRET_VERSION }}
        run: |
          if [ -n "${SOAK_MONTH}${SOAK_START_DAY}${SOAK_END_DAY}${SOAK_CEILING}" ]; then
            echo "::error::steady_state takes no soak window: delete the SOAK_* repository variables"; exit 1
          fi
          versions=()
          for pair in \
            "steam_web_api_key_version=${STEAM_WEB_API_KEY_VERSION}" \
            "igdb_client_id_version=${IGDB_CLIENT_ID_VERSION}" \
            "igdb_client_secret_version=${IGDB_CLIENT_SECRET_VERSION}"; do
            name="${pair%%=*}"; value="${pair#*=}"
            if [ -n "${value}" ]; then
              [[ "${value}" =~ ^[1-9][0-9]*$ ]] || {
                echo "::error::${name} must be a positive whole number (a Secret Manager version), not \"latest\""; exit 1; }
              versions+=(-var "${name}=${value}")
            fi
          done
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -out=tfplan \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "image=${{ steps.image.outputs.image }}" \
            -var "notification_channel=${{ vars.GCP_NOTIFICATION_CHANNEL }}" \
            -var "scheduler_paused=${{ vars.SCHEDULER_PAUSED }}" \
            -var "schedule_mode=steady_state" \
            "${versions[@]}"
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json
          sha256sum tfplan | cut -d' ' -f1 > tfplan.sha256
      - name: Show the plan, and say loudly if it destroys or replaces anything
        working-directory: infra/prod
        run: |
          destructive="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)"
          {
            if [ "${destructive}" != "0" ]; then
              echo "## DESTRUCTIVE PLAN: ${destructive} resource(s) would be DESTROYED or REPLACED"
              jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "- `\(.address)` (\(.change.actions | join(" then ")))"' plan.json
              echo
              echo "Applying this needs allow_destroy as well as the plan's SHA-256."
            else
              echo "## Plan: nothing is destroyed or replaced"
            fi
            echo
            echo "- image: \`${{ steps.image.outputs.image }}\`"
            echo "- image origin: **${{ steps.image.outputs.origin }}**"
            echo "- plan run id: \`${GITHUB_RUN_ID}\`"
            echo "- plan SHA-256: \`$(cat tfplan.sha256)\`"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tfplan
          path: |
            infra/prod/tfplan
            infra/prod/tfplan.sha256
          retention-days: 3

  # Applies one specific plan that a person has read: named by run id AND by hash.
  apply:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.operation == 'apply'
      && inputs.plan_run_id != '' && inputs.plan_sha256 != ''
      && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Fetch the plan that was reviewed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tfplan
          path: infra/prod
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: It must be exactly the plan whose hash was given
        working-directory: infra/prod
        run: |
          actual="$(sha256sum tfplan | cut -d' ' -f1)"
          test "${actual}" = "${{ inputs.plan_sha256 }}" || {
            echo "::error::plan hash mismatch: this is not the plan that was reviewed"; exit 1; }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Refuse an unannounced destroy, then apply exactly that plan
        working-directory: infra/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          destructive="$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')"
          if [ "${destructive}" != "0" ] && [ "${{ inputs.allow_destroy }}" != "true" ]; then
            echo "::error::the plan destroys or replaces ${destructive} resource(s) and allow_destroy was not set"; exit 1
          fi
          terraform apply -input=false tfplan
          echo "Applied plan \`${{ inputs.plan_sha256 }}\` from run \`${{ inputs.plan_run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
