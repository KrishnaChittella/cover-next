# Cover Next: collect, build and publish the public site to GitHub Pages, once a day.
#
# Nothing collected here is committed. The runner is thrown away after each run, so
# YouTube data lives only in the published page and in the cached site data file, both
# replaced every day (YouTube allows 30 days; an unused cache entry is evicted after 7).
# No Google Cloud access: this workflow has no WIF identity.
#
# design_only (manual runs): skip every source and rebuild the site from the last run's
# site data, for design changes between the daily collections. site_data_gz seeds that file
# when no run has cached one yet (it is published as the site anyway).
name: site

on:
  schedule:
    - cron: "30 13 * * *" # daily, after Wikimedia has published the previous day
  workflow_dispatch:
    inputs:
      design_only:
        description: "Rebuild from the last site data without calling any source"
        type: boolean
        default: false
      site_data_gz:
        description: "design_only, first run only: the site data file, gzip then base64"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Python
        run: uv python install && uv sync --locked
      - name: Discover rising games (Wikidata + the day's Wikimedia pageview dump)
        if: ${{ !inputs.design_only }}
        # shortcut: the runner starts empty, so each run re-reads ~2,000 games' history
        # (about 12 minutes). Cache the discovery store between runs if this gets slow.
        run: uv run metaspike discover-games
      - name: YouTube (skipped when the key is not set)
        if: ${{ !inputs.design_only }}
        env:
          METASPIKE_YOUTUBE_API_KEY: ${{ secrets.METASPIKE_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$METASPIKE_YOUTUBE_API_KEY" ]; then
            echo "::warning::METASPIKE_YOUTUBE_API_KEY is not set; YouTube shows as not measured"
          else
            uv run metaspike collect-youtube --stage private_collection || echo "::warning::some YouTube searches failed"
          fi
      # Steam and Twitch history: one reading a day, carried between runs in GitHub's cache
      # (each run saves a new entry; the newest is restored). A lost cache only shortens it.
      # Never a token: .metaspike/tokens stays out of the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.design_only }}
        with:
          path: |
            .metaspike/steam
            .metaspike/twitch-daily
          key: daily-${{ github.run_id }}
          restore-keys: daily-
      - name: Steam players (skipped when the key is not set)
        if: ${{ !inputs.design_only }}
        env:
          METASPIKE_STEAM_WEB_API_KEY: ${{ secrets.METASPIKE_STEAM_WEB_API_KEY }}
        run: |
          if [ -z "$METASPIKE_STEAM_WEB_API_KEY" ]; then
            echo "::warning::METASPIKE_STEAM_WEB_API_KEY is not set; Steam shows as not read"
          else
            uv run metaspike collect-steam || echo "::warning::some Steam readings failed"
          fi
      - name: Twitch live sums (skipped when the IGDB/Twitch credentials are not set)
        if: ${{ !inputs.design_only }}
        env:
          METASPIKE_IGDB_CLIENT_ID: ${{ secrets.METASPIKE_IGDB_CLIENT_ID }}
          METASPIKE_IGDB_CLIENT_SECRET: ${{ secrets.METASPIKE_IGDB_CLIENT_SECRET }}
        run: |
          if [ -z "$METASPIKE_IGDB_CLIENT_ID" ] || [ -z "$METASPIKE_IGDB_CLIENT_SECRET" ]; then
            echo "::warning::IGDB/Twitch credentials are not set; Twitch shows as not read"
          else
            uv run metaspike collect-twitch-daily || echo "::warning::some Twitch readings failed"
          fi
      # The built site's data file, so a design_only run can rebuild without any source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/data/site.json
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-
      - name: Site data
        if: ${{ !inputs.design_only }}
        run: uv run metaspike site-data --out apps/site/data/site.json
      - name: Seed site data from the input (design_only, when given)
        if: ${{ inputs.design_only && inputs.site_data_gz != '' }}
        env:
          SITE_DATA_GZ: ${{ inputs.site_data_gz }}
        run: printf '%s' "$SITE_DATA_GZ" | base64 -d | gunzip > apps/site/data/site.json
      - name: Cached site data matches this build (design_only)
        if: ${{ inputs.design_only }}
        run: |
          uv run python -c "
          import json, sys
          from metaspike.publishing.site import SITE_DATA_VERSION as want
          got = json.load(open('apps/site/data/site.json'))['version']
          sys.exit(0 if got == want else f'cached site data is version {got}, this build needs {want}: run a full build')
          "
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - name: Build
        working-directory: apps/site
        run: npm ci && npm run check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # GitHub Pages' own deployment token, not Google Cloud
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
