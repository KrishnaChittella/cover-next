# Verification. This workflow has NO cloud credentials and requests none: it cannot
# reach GCP, and it calls no MetaSpike data source. Everything runs offline.
#
# It runs in two ways, and never twice for the same commit:
#   - on every pull request;
#   - as the first job of the deploy workflow on main (`workflow_call`), where nothing
#     that touches the cloud can start until every job here has passed.
# It deliberately does NOT also trigger on a push to main: that push already runs it
# through the deploy workflow, and running the same checks twice proved nothing more.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the older run. A run on main is never
  # cancelled, because a deployment may be waiting on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install exactly what is locked
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run mypy
      # Includes the dbt project, run offline against DuckDB in its own locked tool
      # environment (warehouse/). MS_REQUIRE_DBT makes "dbt could not start" a
      # failure here instead of a skip. No BigQuery target is ever used.
      - name: Tests (offline)
        env:
          MS_REQUIRE_DBT: "1"
        run: uv run pytest
      - name: dbt project parses for both targets
        run: |
          for target in offline prod; do
            uv run --project warehouse --locked dbt parse --target "$target" \
              --project-dir warehouse --profiles-dir warehouse
          done
      - name: Artifact schemas are current
        run: uv run metaspike export-schemas --check
      - name: Resolver safety gate (0 false merges)
        run: uv run metaspike evaluate-resolver
      - name: baseline_rules_v1 reproduction pin
        run: uv run pytest tests/test_v1_reproduction.py
      # Both environments the image carries: the application's, and dbt's.
      - name: Dependency audit (application)
        run: uvx pip-audit --strict --requirement <(uv export --locked --no-dev --no-hashes --no-emit-project)
      - name: Dependency audit (dbt runtime)
        run: uvx pip-audit --strict --requirement <(uv export --project warehouse --locked --no-dev --no-hashes --no-emit-project)

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
      - name: Format
        run: terraform fmt -check -recursive infra
      # Validation only. The backend is disabled, so no state is read and no project
      # is contacted; a plan against the real project happens only in the deploy
      # workflow, behind the production environment.
      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate prod
        working-directory: infra/prod
        run: terraform init -backend=false -input=false && terraform validate
      # Offline: the provider is mocked. Proves, among other things, that no job
      # references a source secret unless an explicit numeric version is supplied.
      - name: Terraform tests (mocked provider, nothing planned for real)
        working-directory: infra/prod
        run: terraform test
      # Offline in the same way. Proves the deploy identity holds no data role.
      - name: Terraform tests, bootstrap (mocked provider)
        working-directory: infra/bootstrap
        run: terraform test

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The script fetches the digest-pinned base from Google's public mirror, or from
      # Docker Hub if the mirror does not serve that exact digest, proves the bytes are
      # the pinned ones, and builds with --pull --no-cache so the security-update layer
      # really runs and nothing is taken from a stale local cache.
      - name: Build (not pushed)
        run: .github/scripts/build-image.sh metaspike:ci
      - name: The image runs and is not root
        run: |
          docker run --rm metaspike:ci --help
          test "$(docker run --rm --entrypoint id metaspike:ci -u)" != "0"
      # The image carries dbt in its own environment. It must start, read the project
      # for the production target, and be unable to write to /app or /opt/dbt.
      - name: The image's dbt starts and the image stays read-only
        run: |
          docker run --rm --entrypoint /opt/dbt/bin/dbt metaspike:ci parse --target prod \
            --project-dir /app/warehouse --profiles-dir /app/warehouse \
            --target-path /tmp/dbt-target --log-path /tmp/dbt-logs
          ! docker run --rm --entrypoint sh metaspike:ci -c 'touch /app/x || touch /opt/dbt/x'
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metaspike:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
