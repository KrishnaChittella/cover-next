# MetaSpike warehouse models.
#
# SQL here cleans, de-duplicates and aggregates. It computes NO feature and NO score:
# those are produced by the one Python engine and nothing in this project may
# reproduce them. The default target is the offline one, so a bare `dbt run` cannot
# reach BigQuery.
name: metaspike_warehouse
version: "1.0.0"
config-version: 2
profile: metaspike_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Where a first build or a full refresh starts reading. Unset: the boundary is the
  # earliest partition that holds a row in the raw tables, so ALL retained history is
  # rebuilt, however old. Set it only to replay deliberately from a later point.
  history_start: null
  # An incremental run recomputes this many whole UTC days before today, which is
  # how a late-arriving batch is picked up.
  lookback_days: 3
  # The same for models built from period observations alone. Longer, so that a
  # routine four-day collection is ordinary work and not a late batch.
  period_lookback_days: 7
  # "Now", as the warehouse job saw it, so the job and the models agree on the window.
  run_as_of: null
  # Set by the warehouse job when it loaded rows older than the normal window:
  # the day the affected models must be rebuilt from.
  rebuild_from_samples: null
  rebuild_from_periods: null
  rebuild_from_records: null
  rebuild_from_runs: null

models:
  metaspike_warehouse:
    staging:
      +schema: ms_staging
      +materialized: incremental
      +on_schema_change: fail
    marts:
      +schema: ms_marts
      +materialized: incremental
      +on_schema_change: fail
