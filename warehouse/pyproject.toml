# The dbt tool environment, kept apart from the application on purpose.
#
# dbt and its adapters pin versions of shared tooling that the application's own
# development environment resolves differently, so the two are locked separately:
#   uv run --project warehouse --locked dbt <command> --project-dir warehouse ...
# Nothing here is a runtime dependency of the application image.
[project]
name = "metaspike-warehouse"
version = "0.1.0"
description = "dbt models for MetaSpike's warehouse: cleaning and aggregation only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.11,<1.12",
    "dbt-bigquery>=1.11,<1.13",
    "dbt-duckdb>=1.10,<1.12",
]

[tool.uv]
package = false
