selectors:
  - name: hourly
    description: Sample slots, coverage and source health, with their tests.
    definition:
      method: tag
      value: hourly
  - name: daily
    description: Everything, including period observations and source records.
    definition:
      union:
        - method: tag
          value: hourly
        - method: tag
          value: daily
  - name: periods
    description: Period observations and the run log, with their tests. Used when only period data arrived.
    definition:
      method: tag
      value: periods
