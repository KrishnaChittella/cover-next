selectors:
  - name: hourly
    description: Sample slots, coverage and source health, with their tests.
    definition:
      union:
        - method: tag
          value: hourly
        - exclude:
            - method: tag
              value: production_data
  - name: daily
    description: >-
      Everything, including period observations and source records, and the production
      data checks (tests tagged production_data), which only this selection runs.
    definition:
      union:
        - method: tag
          value: hourly
        - method: tag
          value: daily
  - name: periods
    description: Period observations and the run log, with their tests. Used when only period data arrived.
    definition:
      union:
        - method: tag
          value: periods
        - exclude:
            - method: tag
              value: production_data
